id: s04_mind_change
persona: mind_change
description: >
  Caller settles on a date and time, then changes to a different date late in
  the call. The trap is availability carry-over: the agent must re-check the
  new date rather than assuming the old date's openings still apply.
  Expected slots are the FINAL values.
reference_date: 2026-09-14
channels: [voice, text]
turns:
  - say: "I'd like to book for Tuesday the twenty-second."
  - say: "Three PM."
  - say: "Sorry, actually — can we do Friday the twenty-fifth instead?"
  - say: "Ten AM."
  - say: "Tom Bergstrom."
  - say: "Follow-up on my blood pressure."
  - say: "Yes, that's it."
expected_slots:
  patient_name: {kind: name, expected: "Tom Bergstrom"}
  date:         {kind: date, expected: "2026-09-25"}
  time:         {kind: time, expected: "10am"}
  reason:       {kind: reason, accept_any_of: ["blood pressure", "follow", "hypertension"]}
must_confirm_before_booking: true
expect_tool_calls: [check_availability, book_appointment]
