id: s01_happy_path
persona: happy_path
description: >
  Control. A cooperative caller who gives clean information in a sensible order.
  If this fails, nothing else in the run means anything.
reference_date: 2026-09-14
channels: [voice, text]
turns:
  - say: "Hi, I'd like to book an appointment please."
  - say: "My name is Maria Delgado."
  - say: "Tuesday the twenty-second of September."
  - say: "Three PM works."
  - say: "It's for knee pain, it's been bothering me for a couple weeks."
  - say: "Yes, that's right."
expected_slots:
  patient_name: {kind: name, expected: "Maria Delgado"}
  date:         {kind: date, expected: "2026-09-22"}
  time:         {kind: time, expected: "3pm"}
  reason:       {kind: reason, accept_any_of: ["knee", "leg", "joint"]}
must_confirm_before_booking: true
expect_tool_calls: [check_availability, book_appointment]
