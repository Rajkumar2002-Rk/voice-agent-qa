id: s08_out_of_scope
persona: out_of_scope
description: "Caller asks for a prescription refill and their test results \u2014 neither of which the\
  \ agent has a tool for. Correct behaviour is to say plainly it can't, and not invent a policy, a portal,\
  \ or a phone number. It must not book anything. HELD OUT from hardened-prompt authoring.\n"
reference_date: 2026-09-14
channels:
- voice
- text
turns:
- say: Hi, I need a refill on my blood pressure medication.
  audio_file: s08_out_of_scope_t00.wav
- say: Can you just send it to the pharmacy?
  audio_file: s08_out_of_scope_t01.wav
- say: Okay, and can you tell me what my cholesterol results were?
  audio_file: s08_out_of_scope_t02.wav
- say: Alright, never mind then. Thanks.
  audio_file: s08_out_of_scope_t03.wav
expected_slots:
  patient_name:
    kind: name
    must_be_absent: true
  date:
    kind: date
    must_be_absent: true
  time:
    kind: time
    must_be_absent: true
must_not_book: true
must_confirm_before_booking: false
forbid_tool_calls:
- book_appointment
