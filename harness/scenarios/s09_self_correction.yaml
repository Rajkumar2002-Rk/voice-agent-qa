id: s09_self_correction
persona: self_correction
description: >
  Caller misspeaks a phone number and a date, then corrects both. The trap is
  carry-forward: the agent must replace the old value, not keep it or blend the
  two. Expected slots are the CORRECTED values.
reference_date: 2026-09-14
channels: [voice, text]
turns:
  - say: "I need an appointment on Monday the twenty-eighth."
  - say: "Actually no, sorry — Tuesday the twenty-ninth."
  - say: "Four PM."
  - say: "It's Grace Lindqvist."
  - say: "My number is five five five, one two three, four five six seven."
  - say: "Sorry, that last part is wrong — it's four five six eight, not four five six seven."
  - say: "Annual physical."
  - say: "Yes, that's all correct."
expected_slots:
  patient_name: {kind: name, expected: "Grace Lindqvist"}
  date:         {kind: date, expected: "2026-09-29"}
  time:         {kind: time, expected: "4pm"}
  phone:        {kind: phone, expected: "5551234568"}
  reason:       {kind: reason, accept_any_of: ["physical", "annual", "check"]}
must_confirm_before_booking: true
expect_tool_calls: [check_availability, book_appointment]
