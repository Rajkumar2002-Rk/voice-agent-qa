id: s10_compound_utterance
persona: compound_utterance
description: 'Caller packs multiple fields into single utterances - name+date together, then time+reason
  together. The failure mode is silent dropping: the agent acknowledges one field and asks for the other
  as if it were never given. NOTE: patient_name declares romanization aliases. Without them this scenario
  silently tested STT orthography instead of compound-utterance handling - ''Yusuf'' transcribes as ''Youssef'',
  which is the same name. See B20 in notes.md.'
reference_date: 2026-09-14
channels:
- voice
- text
turns:
- say: Hi, this is Yusuf Karim and I need to come in Thursday the seventeenth.
  audio_file: s10_compound_utterance_t00.wav
- say: Nine thirty AM, and it's for a rash on my arm.
  audio_file: s10_compound_utterance_t01.wav
- say: Yes, that's everything.
  audio_file: s10_compound_utterance_t02.wav
expected_slots:
  patient_name:
    kind: name
    expected: Yusuf Karim
    aliases:
    - Youssef Karim
    - Yousef Karim
    - Yusef Karim
  date:
    kind: date
    expected: '2026-09-17'
  time:
    kind: time
    expected: 9:30am
  reason:
    kind: reason
    accept_any_of:
    - rash
    - skin
    - arm
must_confirm_before_booking: true
expect_tool_calls:
- check_availability
- book_appointment
