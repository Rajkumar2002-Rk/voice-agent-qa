[project]
name = "voice-agent-qa"
version = "0.1.0"
description = "Deterministic QA/evaluation harness for Retell voice agents"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "rich>=13.7",
]

[project.optional-dependencies]
audio = ["playwright>=1.44"]
judge = ["anthropic>=0.34", "openai>=1.40"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["harness*", "agent*"]
